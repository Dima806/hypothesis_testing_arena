name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # The reduced-rep simulation profile. Published numbers come from the `full` profile via
      # `make notebooks`; CI only needs the assertions to hold, not the headline precision.
      HTA_PROFILE: ci
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Lint, format check and typecheck
        run: |
          uv run ruff format --check src/ tests/ app/
          uv run ruff check src/ tests/ app/
          uv run ty check src/

      - name: Test
        run: uv run pytest
